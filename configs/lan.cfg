// ============================================================
// lan.cfg  --  turn this client-hosted match into a server friends join
// CS:GO Legacy (appid 4465480, build 13881), listen server.
//
// Load order at map start:
//   cfg/listenserver.cfg -> exec bots_improved.cfg  (then, at map load)
//   cfg/gamemode_competitive_offline.cfg -> exec bots_improved.cfg
// So run "exec lan.cfg" from the console AFTER the match starts: this file
// is applied last and wins.
//
// Names here were whole-word matched against this install's csgo/bin/server.dll
// and bin/engine.dll. See the notes for why each value is what it is.
// ============================================================

// ---------- identity and access ----------
hostname                        "LAN"
sv_password                     0                 // set a quoted password to lock it
sv_lan                          0
// DO NOT set sv_lan 1. engine.dll: "Server is a lan server ( no heartbeat, no
// authentication, no non-class C addresses )". Without authentication everyone
// gets STEAM_ID_LAN, and weapons/database.sp calls
// GetClientAuthId(client, AuthId_Steam2, ..., true) -- fail-closed, and there is
// no else branch -- so nobody's skin/glove/knife row loads or saves.
sv_pure                         0                 // NOT a cvar in build 13881 (reads as no such cvar); harmless no-op line, kept as a note
// (sv_allow_lobby_connect_only and sv_mincuprate do not exist in this build;
//  both were dropped after whole-word checks against server.dll + engine.dll.)

// ---------- net (LAN and Tailscale are both low latency) ----------
sv_maxrate                      0
sv_minrate                      0
sv_minupdaterate                10
sv_maxupdaterate                60

// ---------- slots: humans in, bots step aside ----------
// bot_quota_mode fill keeps this many TOTAL slots including every human, and
// bot_auto_vacate 1 (set in bots_improved.cfg) makes bots yield their slot.
// 10 = host + up to 9 friends, or fewer humans + bots to fill the rest.
bot_quota						10
mp_allowspectators              1
mp_autoteambalance              0
mp_limitteams                   0
mp_autokick                     0
mp_logdetail                    0                 // keep the console readable

// ---------- let friends pick in, then start together ----------
mp_do_warmup_period             1
mp_warmuptime                   600
mp_warmup_pausetimer            1                 // warmup does not expire; you end it
// when everyone is in, type:  mp_warmup_end
// to pause it again:         mp_warmup_pause

// ---------- cheats ----------
// Off by default for LAN: noclip, impulse 101, sv_showimpacts and the devonly
// ai_* / bot_*_override tuning in bots_improved.cfg stop working, and friends
// cannot use them either.
// Bot strength does NOT depend on this: botprofile.db and bot_stuff.smx work
// through BotProfileManager + memory offsets, not through cheat cvars.
sv_cheats                       0
// If it is only trusted people, set sv_cheats 1 here and the perception/aim
// tuning from bots_improved.cfg becomes effective again.

// ---------- round flow stays competitive ----------
// (mp_roundtime 1.92 / mp_freezetime 15 / mp_maxrounds 30 come from
//  bots_improved.cfg; repeated here so this file is self-contained.)
mp_roundtime                    1.92
mp_roundtime_defuse             1.92
mp_roundtime_hostage            1.92
mp_freezetime                   15
mp_maxrounds                    30
mp_halftime                     1
mp_timelimit                    0
mp_startmoney                   800
mp_maxmoney                     16000
mp_afterroundmoney              0

// ---------- remote control (what makes the companion tool possible) ----------
// rcon_password is set at runtime by you, never stored in a file:
//   rcon_password <secret>
// then an external program on this machine (or on the LAN) can send console
// commands to the running server over UDP with the standard Source RCON
// protocol. Engine supports sv_rcon_maxfailures / sv_rcon_minfailures /
// sv_rcon_banpenalty and sv_rcon_minfailuretime.
